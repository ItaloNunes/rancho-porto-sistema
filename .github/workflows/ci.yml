name: CI — testes do backend

# Roda a suíte de testes a cada push/PR na main. Serve de porteiro: se algo
# quebrar (ex.: o bug do desconto de 05/11), o commit fica vermelho ANTES de
# chegar na produção. O deploy no Render continua automático no push; este
# workflow é o sinal de que o código está saudável.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar LibreOffice (teste de fidelidade do PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Rodar a suíte de testes
        working-directory: backend
        run: python -m pytest tests/ -q
