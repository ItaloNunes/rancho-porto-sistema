name: CI — testes do backend

# Roda a suíte de testes a cada push/PR na main. Serve de porteiro: se algo
# quebrar (ex.: o bug do desconto de 05/11), o commit fica vermelho ANTES de
# chegar na produção. O deploy no Render continua automático no push; este
# workflow é o sinal de que o código está saudável.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar LibreOffice (teste de fidelidade do PDF)
        # + as mesmas fontes do contrato (Calibri -> Carlito, Arial/Times -> Liberation): sem elas o
        # LibreOffice troca a fonte e o PDF de referência sai com as palavras quebradas nos acentos
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito fonts-liberation fonts-liberation2

      - name: Instalar dependências
        run: pip install -r backend/requirements-dev.txt  # requirements.txt + pytest

      - name: Rodar a suíte de testes
        working-directory: backend
        run: python -m pytest tests/ -q
