name: Manter backend acordado

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar /health
        run: |
          curl -fsS --max-time 55 https://rancho-porto-sistema.onrender.com/health || echo "Ping falhou (deploy em andamento, talvez) - sem problema, proxima tentativa em 5 min."
